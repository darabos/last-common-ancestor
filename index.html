<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#eef2ec" />
    <title>Last Common Ancestor</title>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="app.mjs"></script>
  </head>
  <body>
    <main class="workspace">
      <form class="controls" id="simulation-form">
        <label class="control-field">
          <span class="field-label">Population size</span>
          <input id="population-size" name="population-size" type="number" min="1" step="1" value="30" required />
        </label>
        <span class="control-divider" aria-hidden="true"></span>
        <label class="control-field">
          <span class="field-label">Generations before split</span></span>
          <input id="pre-split-generations" name="pre-split-generations" type="number" min="1" step="1" value="5" required />
        </label>
        <span class="control-divider" aria-hidden="true"></span>
        <label class="control-field">
          <span class="field-label">Generations after split</span>
          <input id="post-split-generations" name="post-split-generations" type="number" min="0" step="1" value="5" required />
        </label>
        <fieldset class="lineage-control">
          <legend class="field-label">Show lineage through</legend>
          <div class="lineage-segmented">
            <label class="lineage-choice">
              <input type="radio" name="lineage-mode" value="both" checked />
              <span>Both parents</span>
            </label>
            <label class="lineage-choice">
              <input type="radio" name="lineage-mode" value="paternal" />
              <span>Father to son</span>
            </label>
            <label class="lineage-choice">
              <input type="radio" name="lineage-mode" value="maternal" />
              <span>Mother to daughter</span>
            </label>
          </div>
        </fieldset>
        <button class="run-button" type="submit">
          <span>Run simulation</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M4 10h11M10 5l5 5-5 5" /></svg>
        </button>
      </form>
      <p class="form-error" id="form-error" role="alert" aria-live="polite"></p>

      <div class="description">
        <p>Click to select/deselect individuals and see their lineage. Or click a generation label (like "<tt>G03</tt>") to select the whole generation.</p>
      </div>
      <section class="results" aria-label="Population genealogy">
        <div class="results-head">
          <div class="legend" aria-label="Gender legend">
            <span class="legend-item"><i class="legend-dot male"></i> Male</span>
            <span class="legend-item"><i class="legend-dot female"></i> Female</span>
            <span class="legend-item"><i class="legend-ring"></i> Selected</span>
            <span class="legend-item"><i class="legend-ring common"></i> Last common ancestor</span>
            <button class="clear-button" id="clear-selection" type="button" disabled>Clear selection</button>
          </div>
        </div>

        <div class="diagram-frame" id="diagram-frame" tabindex="0" aria-label="Scrollable genealogy diagram">
          <svg id="genealogy" class="genealogy" role="group" aria-label="Population genealogy diagram"></svg>
        </div>

        <div class="results-foot">
          <p id="status-message" role="status" aria-live="polite">Run a simulation to begin.</p>
          <div class="selection-summary" id="selection-summary">No individuals selected</div>
          <p><a href="https://github.com/darabos/last-common-ancestor/">Source code</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
